[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-orthomap"
version = "0.1.0"
description = "Auditable, heart-focused orthology mapping for raw single-cell counts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "DATA_SOURCES.md", "src/heart_orthomap/data/NOTICE.md"]
authors = [{name = "Azad Alizada"}]
dependencies = ["numpy>=1.23", "pandas>=1.5", "scipy>=1.9", "anndata>=0.9"]

[project.optional-dependencies]
plots = ["matplotlib>=3.6"]
dev = ["build>=1", "pytest>=7"]

[project.scripts]
heart-orthomap = "heart_orthomap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
heart_orthomap = ["data/*.tsv.gz", "data/*.json", "data/*.md"]
