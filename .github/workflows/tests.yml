name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -B validation/run_validation.py --self-check
      - run: python -B validation/run_validation.py --installed
      - run: python examples/convert_toy.py --out /tmp/heart-orthomap-example
      - run: heart-orthomap audit --species mouse --out /tmp/mouse-audit
      - run: heart-orthomap audit --species zebrafish --out /tmp/fish-audit
